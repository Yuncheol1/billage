spring:
  application:
    name: be

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/billage?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://user:1234@localhost:27017/billage?authSource=admin}

auth:
  jwt:
    issuer: ${JWT_ISSUER:be}
    secret: ${JWT_SECRET:}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
    refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    scope: ${KAKAO_SCOPE:account_email,name,gender,birthday,birthyear,phone_number,friends,talk_message}
    token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}

ssafy:
  api:
    base-url: ${SSAFY_API_BASE_URL:https://finopenapi.ssafy.io}
    api-key: ${SSAFY_API_KEY:}
    institution-code: ${SSAFY_INSTITUTION_CODE:00100}
    fintech-app-no: ${SSAFY_FINTECH_APP_NO:001}
    member-search-path: ${SSAFY_MEMBER_SEARCH_PATH:/ssafy/api/v1/member/search}
    member-create-path: ${SSAFY_MEMBER_CREATE_PATH:/ssafy/api/v1/member}
    create-demand-deposit-account-path: ${SSAFY_CREATE_DEMAND_DEPOSIT_ACCOUNT_PATH:/ssafy/api/v1/edu/demandDeposit/createDemandDepositAccount}
    demand-deposit-account-type-unique-no: ${SSAFY_DEMAND_DEPOSIT_ACCOUNT_TYPE_UNIQUE_NO:001-1-f8b3869eff034c}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
