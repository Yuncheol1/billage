<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 마이크로서비스(FastAPI) 테스트 클라이언트</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ AI 법률/세무 테스트 클라이언트</h1>
            <p>FastAPI 백엔드의 응답을 직접 확인하는 단위 테스트 페이지입니다.</p>
            <div class="auth-config">
                <label>Internal API Key: </label>
                <input type="text" id="apiKey" value="" placeholder="Enter Internal API Key" size="40">
                <span class="note">* 백엔드 설정(`config.py`)과 일치해야 통과됩니다.</span>
            </div>
        </header>

        <div class="test-sections">
            <!-- 1. 독소조항 / 세금 분석 -->
            <section class="card">
                <h2>1. 차용증 독소조항 / 세금 분석</h2>
                <div class="form-group">
                    <label>차용증 문구 (조항 단위 가능):</label>
                    <textarea id="analyzeText" rows="4">제2조(상환) 상환기일에 원금을 갚지 못할 경우, 연 30%의 지연이자를 가산하며 신체포기각서를 이행한다.</textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>원금 (원):</label>
                        <input type="number" id="principal" value="10000000">
                    </div>
                    <div class="form-group">
                        <label>적용 이자율 (%):</label>
                        <input type="number" step="0.1" id="interest" value="0">
                    </div>
                </div>
                <button onclick="testAnalyze()">[API 호출] 분석하기</button>
                <div class="result-box" id="analyzeResult">결과가 여기에 표시됩니다.</div>
            </section>

            <!-- 2. 특약사항 생성 -->
            <section class="card">
                <h2>2. 자연어 기반 특약사항 변환</h2>
                <div class="form-group">
                    <label>사용자 의도 (자연어):</label>
                    <input type="text" id="clauseIntent" value="돈 안갚으면 타고 다니는 차 뺏을거임" class="full-width">
                </div>
                <button onclick="testClause()">[API 호출] 법률 문장으로 변환</button>
                <div class="result-box" id="clauseResult">결과가 여기에 표시됩니다.</div>
            </section>

            <!-- 3. 법률 챗봇 -->
            <section class="card">
                <h2>3. 세무/법률 Q&A 챗봇</h2>
                <div class="form-group">
                    <label>질문하기:</label>
                    <input type="text" id="chatMessage" value="부모님께 5천만원 빌릴건데 차용증 어떻게 써야 증여세를 안낼까" class="full-width">
                </div>
                <button onclick="testChat()">[API 호출] 질문 전송</button>
                <div class="result-box" id="chatResult">결과가 여기에 표시됩니다.</div>
            </section>
        </div>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
